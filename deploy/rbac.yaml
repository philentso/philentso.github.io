apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-board
  namespace: task-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-board
  namespace: task-pipeline
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  # 查看日志用（只有 ENABLE_LOGS=1 时才会被用到）
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-board
  namespace: task-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task-board
subjects:
  - kind: ServiceAccount
    name: task-board
    namespace: task-pipeline
